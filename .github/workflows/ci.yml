name: CI

# Phase 2 §5.1: lint, test, build and migration review for every deliverable.
# Everything runs from a clean checkout; no local state is assumed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format
        run: ruff format --check app tests
      - name: Pytest
        run: pytest
      - name: Migrations are reviewable offline
        run: |
          alembic upgrade head --sql > "${RUNNER_TEMP}/migrations.sql"
          test -s "${RUNNER_TEMP}/migrations.sql"

  frontend:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  mobile:
    name: Mobile (analyze, test — scaffold)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Platform runners (android/, ios/) are generated locally with
      # `flutter create .` until a device build is part of the plan.

  compose:
    name: Deploy (compose config and image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.dev.yml \
            config --quiet
      - name: Build API image
        run: docker build --tag ps03-api:ci backend
      - name: Build web image
        run: docker build --tag ps03-web:ci frontend
