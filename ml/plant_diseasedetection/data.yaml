# dataset/data.yaml reference for the 116-class plant disease benchmark.
# Source composition: plantwild (laboratory, 18,533 images, 89 classes) +
# FieldPlant (field, 5,156 images, 27 classes).

path: ../dataset                # dataset root (relative to this file)
train: train/images
val: val/images
test: test/images

nc: 116
