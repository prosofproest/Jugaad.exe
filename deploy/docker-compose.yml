# Local development stack for PS-03 (Phase 2 §5.1).
#
# Usage:
#   cp deploy/.env.example deploy/.env      # then edit POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build
#
# This file is the base for every environment. Staging/production reuse the
# same images but inject environment variables from the platform secret store
# instead of deploy/.env (see deploy/README.md).

name: ps03

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ps03}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ps03}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ps03-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ps03} -d ${POSTGRES_DB:-ps03}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-dev}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_DOCS_ENABLED: ${APP_DOCS_ENABLED:-true}
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ps03}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ps03}
      # Comma-separated or JSON list; pydantic-settings accepts JSON.
      APP_CORS_ORIGINS: '["${WEB_ORIGIN:-http://localhost:3000}"]'
      # Local default only; a production deployment must inject a unique
      # >=32-character secret from the platform secret store.
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-dev-only-insecure-secret-change-me}
      # Chat engine (spec 08). Defaults to the labelled demo engine; the
      # provider key stays unset unless the deployment supplies it.
      APP_CHAT_ENGINE: ${APP_CHAT_ENGINE:-demo}
      APP_CHAT_API_KEY: ${APP_CHAT_API_KEY:-}
      APP_CHAT_BASE_URL: ${APP_CHAT_BASE_URL:-https://api.openai.com/v1}
      APP_CHAT_MODEL: ${APP_CHAT_MODEL:-}
      APP_CHAT_LABELS: ${APP_CHAT_LABELS:-[]}
      APP_CHAT_LABELS_APPROVED: ${APP_CHAT_LABELS_APPROVED:-false}
      # Video reading (spec 09). The shipped detector is demo-only; these
      # ceilings bound decode work and storage.
      APP_VIDEO_MAX_BYTES: ${APP_VIDEO_MAX_BYTES:-52428800}
      APP_VIDEO_MAX_DURATION_S: ${APP_VIDEO_MAX_DURATION_S:-30}
      APP_VIDEO_MAX_DIMENSION: ${APP_VIDEO_MAX_DIMENSION:-1920}
      APP_VIDEO_SAMPLE_FPS: ${APP_VIDEO_SAMPLE_FPS:-2}
      APP_VIDEO_MAX_FRAMES: ${APP_VIDEO_MAX_FRAMES:-24}
      APP_VIDEO_FRAME_MAX_SIDE: ${APP_VIDEO_FRAME_MAX_SIDE:-1024}
      APP_VIDEO_MIN_USABLE_FRAMES: ${APP_VIDEO_MIN_USABLE_FRAMES:-3}
      APP_VIDEO_MIN_DURATION_MS: ${APP_VIDEO_MIN_DURATION_MS:-500}
      APP_VIDEO_ASSESS_FRAMES: ${APP_VIDEO_ASSESS_FRAMES:-3}
      APP_VIDEO_TRACK_IOU: ${APP_VIDEO_TRACK_IOU:-0.3}
      APP_VIDEO_TRACK_MAX_AGE: ${APP_VIDEO_TRACK_MAX_AGE:-5}
      APP_VIDEO_MOTION_THRESHOLD: ${APP_VIDEO_MOTION_THRESHOLD:-25}
      APP_VIDEO_MOTION_MIN_AREA_FRACTION: ${APP_VIDEO_MOTION_MIN_AREA_FRACTION:-0.005}
      APP_MEDIA_ROOT: /var/media
    volumes:
      - ps03-media:/var/media
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Server-side rendering happens inside the container network.
      API_BASE_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/chat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  ps03-db:
  ps03-media:
