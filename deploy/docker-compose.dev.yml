# Local-development overrides for PS-03.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build
#
# Source is bind-mounted for hot reload; anonymous volumes keep the image's
# node_modules and .next away from the host.

services:
  api:
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-dev}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-DEBUG}

  web:
    build:
      target: dev
    command: ["npm", "run", "dev"]
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      API_BASE_URL: http://api:8000
      WATCHPACK_POLLING: "true"
