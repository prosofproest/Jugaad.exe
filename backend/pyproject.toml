[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps03-api"
version = "0.1.0"
description = "PS-03 modular-monolith API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "Pillow>=10.4,<12.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.10,<6.0",
    "argon2-cffi>=23,<26",
    "PyJWT>=2,<3",
    "pyotp>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency defaults are the framework idiom.
